[package]
name = "pico2-6502-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
description = "A MOS 6502 computer inside a Raspberry Pi Pico 2, written in Rust"
repository = "https://github.com/chadlung/Pico2-6502-rs"

[features]
default = ["std"]
std = []
firmware = []

[dependencies]
heapless = "0.9.1"
mos6502 = "0.10.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
static_cell = "2.1.1"

[[bin]]
name = "sim6502"
path = "src/bin/sim6502.rs"
required-features = ["std"]

[[bin]]
name = "pico6502"
path = "src/bin/pico6502.rs"
required-features = ["firmware"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
